<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>分子文艺复兴 · Molecular Renaissance</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; color: #25282b; background: #eceeef; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { max-width: 1400px; margin: auto; padding: 30px 32px 22px; display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
    h1 { margin: 0; font-size: 24px; font-weight: 650; letter-spacing: .06em; }
    header p { margin: 0; color: #676c71; font-size: 13px; }
    main { max-width: 1400px; margin: auto; padding: 0 32px 30px; display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 22px; align-items: start; }
    .artboard { background: #fff; border: 1px solid #d9dde0; min-width: 0; }
    #preview { width: 100%; aspect-ratio: 9 / 7; min-height: 0; display: flex; overflow: auto; cursor: grab; touch-action: none; user-select: none; }
    #preview.dragging { cursor: grabbing; }
    /* Auto margins center spare space without shrinking the SVG. */
    #preview svg { display: block; flex: 0 0 auto; margin: auto; width: auto; height: auto; max-width: none; max-height: none; }
    #preview p { padding: 24px; color: #73787c; text-align: center; }
    .preview-caption { padding: 0 20px 24px; text-align: center; font-family: Georgia, 'Times New Roman', serif; }
    .molecule-caption { margin: 0 0 8px; font-size: 24px; line-height: 1.2; color: #161616; }
    .signature-caption { margin: 0; font-size: 20px; line-height: 1.3; letter-spacing: 2px; font-variant: small-caps; color: #555; }
    .board-footer { padding: 13px 18px; border-top: 1px solid #edf0f2; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; color: #72777b; font-size: 12px; }
    aside { padding: 16px; background: #e2e5e7; border: 1px solid #d4d8db; border-radius: 6px; position: sticky; top: 20px; max-height: calc(100vh - 40px); max-height: calc(100dvh - 40px); display: flex; flex-direction: column; }
    h2 { margin: 0 0 16px; font-size: 15px; font-weight: 650; flex-shrink: 0; }
    .settings-body { min-height: 0; overflow-y: auto; scrollbar-width: thin; padding-right: 4px; }
    .settings-group { border-top: 1px solid #cbd1d5; }
    .settings-group summary { padding: 12px 0; font-size: 13px; font-weight: 600; cursor: pointer; user-select: none; }
    .settings-group[open] summary { margin-bottom: 4px; }
    .control { margin-bottom: 15px; }
    .control-heading { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; font-size: 13px; }
    output { color: #5b636a; font-variant-numeric: tabular-nums; white-space: nowrap; }
    select, button { font: inherit; }
    select { width: 100%; padding: 7px 9px; border: 1px solid #bfc5c9; background: #fff; color: #25282b; border-radius: 4px; font-size: 13px; }
    input[type="range"] { width: 100%; margin: 0; accent-color: #566571; cursor: pointer; }
    .check { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 12px 0; cursor: pointer; }
    input[type="checkbox"] { width: 15px; height: 15px; margin: 0; accent-color: #566571; }
    .label-settings { border: 0; padding: 0; margin: 0; min-width: 0; }
    .label-settings:disabled { opacity: .5; }
    .label-settings input[type="text"] { width: 100%; padding: 7px 8px; border: 1px solid #bfc5c9; border-radius: 4px; font: inherit; font-size: 13px; }
    .color-control { display: flex; align-items: center; justify-content: space-between; font-size: 13px; margin-bottom: 12px; }
    .color-control input { width: 48px; height: 27px; padding: 2px; border: 1px solid #bfc5c9; background: white; }
    .check-row { display: flex; gap: 20px; }
    .actions { display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid #cbd1d5; flex-shrink: 0; }
    button { padding: 10px 6px; border: 1px solid #b8c0c6; border-radius: 4px; background: #f7f8f9; color: #303b44; font-size: 13px; cursor: pointer; }
    button:hover:not(:disabled) { background: #fff; border-color: #82929e; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    :focus-visible { outline: 2px solid #57778f; outline-offset: 4px; }
    #error { margin: 12px 0 0; color: #9d3434; font-size: 13px; line-height: 1.6; overflow-y: auto; }
    [hidden] { display: none !important; }
    @media (max-width: 760px) {
      header { padding: 22px 16px 18px; display: block; }
      header p { margin-top: 8px; }
      main { padding: 0 16px 22px; grid-template-columns: 1fr; gap: 16px; }
      aside { position: static; max-height: none; }
      .settings-body { overflow: visible; padding-right: 0; }
    }
  </style>
</head>
<body>
  <header><h1>分子文艺复兴</h1><p lang="en">Molecular Renaissance</p></header>
  <main>
    <section class="artboard" aria-label="分子图版">
      <div id="preview" aria-label="分子预览，可拖拽旋转；也可使用右侧角度滑块"><p>正在准备图版…</p></div>
      <div class="preview-caption"><p id="molecule-caption" class="molecule-caption"></p><p class="signature-caption" lang="en">Molecular Renaissance</p></div>
      <div class="board-footer"><span id="model-info">900 × 700 · SVG</span><span id="timing" role="status">等待渲染</span><span>拖拽图版旋转</span></div>
    </section>
    <aside aria-label="渲染控制">
      <h2>图版设置</h2>
      <div class="settings-body">
        <div class="control"><label class="control-heading" for="model">模型</label><select id="model" aria-label="示例模型"></select></div>
        <details class="settings-group" name="settings" open>
          <summary>大小与视角</summary>
          <div class="control"><div class="control-heading"><label for="scale" title="SVG 单位/Å；只缩放几何，不缩放纹理">整图比例</label><output id="scale-value" for="scale">60</output></div><input id="scale" type="range" min="20" max="200" step="1" value="60"></div>
          <div class="control"><div class="control-heading"><label for="atom-radius-scale">原子半径倍率</label><output id="atom-radius-scale-value" for="atom-radius-scale">1.00×</output></div><input id="atom-radius-scale" type="range" min="0.2" max="2" step="0.05" value="1"></div>
          <div class="control"><div class="control-heading"><label for="yaw">水平旋转</label><output id="yaw-value" for="yaw">25°</output></div><input id="yaw" type="range" min="-180" max="180" step="1" value="25"></div>
          <div class="control"><div class="control-heading"><label for="pitch">俯仰角度</label><output id="pitch-value" for="pitch">−15°</output></div><input id="pitch" type="range" min="-90" max="90" step="1" value="-15"></div>
        </details>
        <details class="settings-group" name="settings">
          <summary>纹理与线条</summary>
          <div class="control"><label class="control-heading" for="shading-mode">明暗模式</label><select id="shading-mode"><option value="hatch" selected>排线</option><option value="stipple">点刻</option><option value="halftone">规则网点</option></select></div>
          <div class="control"><div class="control-heading"><label for="texture-scale" title="向左更细密，向右更粗疏，平均黑度尽量不变">纹理粗细</label><output id="texture-scale-value" for="texture-scale">1.00×</output></div><input id="texture-scale" type="range" min="20" max="250" step="5" value="100"></div>
          <div class="control"><div class="control-heading"><label for="shading-brightness">亮度</label><output id="shading-brightness-value" for="shading-brightness">0</output></div><input id="shading-brightness" type="range" min="-100" max="100" step="5" value="0"></div>
          <div class="control"><div class="control-heading"><label for="shading-contrast">对比度</label><output id="shading-contrast-value" for="shading-contrast">1.2</output></div><input id="shading-contrast" type="range" min="0.5" max="2.5" step="0.1" value="1.2"></div>
          <div class="control"><div class="control-heading"><label for="outline-width">轮廓线宽</label><output id="outline-width-value" for="outline-width">0.80</output></div><input id="outline-width" type="range" min="0" max="4" step="0.05" value="0.8"></div>
          <label class="check"><input id="variable-width" type="checkbox" checked>渐变线宽</label>
          <label class="check"><input id="cross-hatch" type="checkbox" checked>交叉排线</label>
        </details>
        <details class="settings-group" name="settings">
          <summary>光照与阴影</summary>
          <div class="control"><div class="control-heading"><label for="light-azimuth">光源方位</label><output id="light-azimuth-value" for="light-azimuth">−29°</output></div><input id="light-azimuth" type="range" min="-180" max="180" step="1" value="-29"></div>
          <div class="control"><div class="control-heading"><label for="light-elevation">光源仰角</label><output id="light-elevation-value" for="light-elevation">32°</output></div><input id="light-elevation" type="range" min="-90" max="90" step="1" value="32"></div>
          <label class="check"><input id="point-light" type="checkbox">点光源</label>
          <div class="control"><div class="control-heading"><label for="light-distance">光源距离</label><output id="light-distance-value" for="light-distance">∞</output></div><input id="light-distance" type="range" min="1.2" max="12" step="0.1" value="3" disabled></div>
          <div class="control"><div class="control-heading"><label for="light-attenuation" title="0 表示不衰减">衰减强度</label><output id="light-attenuation-value" for="light-attenuation">0.000</output></div><input id="light-attenuation" type="range" min="0" max="0.2" step="0.005" value="0" disabled></div>
          <label class="check"><input id="cast-shadows" type="checkbox" checked>投射阴影</label>
          <div class="control"><div class="control-heading"><label for="shadow-strength">阴影强度</label><output id="shadow-strength-value" for="shadow-strength">80%</output></div><input id="shadow-strength" type="range" min="0" max="100" step="5" value="80"></div>
        </details>
        <details class="settings-group" name="settings">
          <summary>配色</summary>
          <div class="control"><label class="control-heading" for="color-scheme">色表</label><select id="color-scheme"><option value="jmol" selected>Jmol / ChimeraX</option><option value="rasmol">RasMol (CPK)</option><option value="pymol">PyMOL 元素色</option><option value="greenCarbon">3Dmol · 绿碳</option><option value="cyanCarbon">3Dmol · 青碳</option><option value="magentaCarbon">3Dmol · 品红碳</option></select></div>
          <label class="check"><input id="color-wash" type="checkbox" checked>元素底色</label>
          <div class="control"><div class="control-heading"><label for="wash-strength">浓度</label><output id="wash-strength-value" for="wash-strength">100%</output></div><input id="wash-strength" type="range" min="0" max="100" step="5" value="100"></div>
          <div class="control"><div class="control-heading"><label for="color-saturation">饱和度</label><output id="color-saturation-value" for="color-saturation">100%</output></div><input id="color-saturation" type="range" min="0" max="100" step="5" value="100"></div>
        </details>
        <details class="settings-group" name="settings">
          <summary>元素标签</summary>
          <label class="check"><input id="labels" type="checkbox">显示标签</label>
          <fieldset id="label-settings" class="label-settings" disabled aria-label="元素标签样式">
            <div class="control"><div class="control-heading"><label for="label-size">字号</label><output id="label-size-value" for="label-size">17</output></div><input id="label-size" type="range" min="6" max="96" step="1" value="17"></div>
            <div class="control"><label class="control-heading" for="label-font">字体</label><input id="label-font" type="text" list="label-font-options" maxlength="200" value="Georgia, 'Times New Roman', serif">
              <datalist id="label-font-options">
                <option value="Georgia, 'Times New Roman', serif"></option>
                <option value="'Times New Roman', serif"></option>
                <option value="'EB Garamond', Garamond, serif"></option>
                <option value="Baskerville, 'Baskerville Old Face', serif"></option>
                <option value="Arial, sans-serif"></option>
                <option value="'Courier New', monospace"></option>
              </datalist>
            </div>
            <div class="check-row"><label class="check"><input id="label-bold" type="checkbox">粗体</label><label class="check"><input id="label-italic" type="checkbox" checked>斜体</label></div>
            <div class="color-control"><label for="label-color">文字颜色</label><input id="label-color" type="color" value="#161616"></div>
            <div class="control"><div class="control-heading"><label for="label-stroke-width">描边宽度</label><output id="label-stroke-width-value" for="label-stroke-width">4.0</output></div><input id="label-stroke-width" type="range" min="0" max="16" step="0.5" value="4"></div>
            <label class="check"><input id="label-match-fill" type="checkbox" checked>描边匹配底色</label>
            <div class="color-control"><label for="label-stroke-color">描边颜色</label><input id="label-stroke-color" type="color" value="#ffffff"></div>
          </fieldset>
        </details>
      </div>
      <div class="actions"><button id="reset" type="button">重置</button><button id="download" type="button" disabled>下载 SVG</button></div>
      <p id="error" role="alert" hidden></p>
    </aside>
  </main>
  <noscript>请启用 JavaScript 以生成分子图版。</noscript>
  <script src="dot-regions.js"></script>
  <script src="boundaries.js"></script>
  <script src="wash.js"></script>
  <script src="dots.js"></script>
  <script src="renderer.js"></script>
  <script src="app.js"></script>
</body>
</html>
